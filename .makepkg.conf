# User overrides. Sourced after /etc/makepkg.conf and /etc/makepkg.conf.d/*.conf,
# so this wins. See /usr/share/makepkg/util/config.sh:51-58.
#
# !debug stops makepkg emitting -debug split packages. Their files are keyed by
# build-id under the shared /usr/lib/debug/.build-id/ namespace, so two packages
# shipping the same upstream prebuilt binary (identical binary -> identical
# build-id) claim the same path and pacman aborts the whole transaction. That is
# what blocked the Mullvad 2026.4 upgrade against teams-for-linux.
#
# Symbols for official repo packages are unaffected: they come from debuginfod
# (DEBUGINFOD_URLS=https://debuginfod.archlinux.org, exported by
# /etc/profile.d/debuginfod.sh), not from local -debug packages.
#
# To build ONE package with symbols again, either:
#   - add options=(debug strip) to that PKGBUILD (PKGBUILD options win), or
#   - makepkg --config /path/to/a/copy/of/makepkg.conf
# Note: --config /etc/makepkg.conf does NOT work. config.sh compares the *value*
# of MAKEPKG_CONF against the literal string "/etc/makepkg.conf", so passing that
# exact path still sources this file. The copy must live somewhere else.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)
