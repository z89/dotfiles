;------------------------------------------------;
;                                                ;
;         Polybar config created by z89          ;
;                                                ;
;------------------------------------------------;


;###### COLORS ######
;####################

[colors]
background-active = #a5d3f0
background-alert = #7adfff
enable-ipc = true
foreground-darker =  #556c97

;####### BAR ########
;####################

[bar/primary]
monitor = DisplayPort-1
width = 100%
height = 36
fixed-center = true
override-redirect = false
wm-restack = i3

background = #050717
foreground = #ffffff

font-0 = Misc Termsyn:style=Regular:size=7;1
font-1 = Symbols Nerd Font:style=Regular:size=10;2

modules-left = i3 
modules-center = 
;modules-right = spotify spotify-prev spotify-play spotify-play-pause spotify-next wifi-ssid ip calendar volume
modules-right =  cpu memory ip date calendar volume

tray-padding = 6
tray-detached = false
tray-position = right

[bar/secondary]
monitor = DVI-D-0
width = 100%
height = 36
fixed-center = true
override-redirect = false
wm-restack = i3

background = #050717
foreground = #7adfff

font-0 = Misc Termsyn:style=Regular:size=8;1
font-1 = Symbols Nerd Font:style=Regular:size=12;2

modules-left = i3 
modules-center = 
modules-right = 

;###### i3 MODULE ######
;#######################

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = true

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;󰎞
ws-icon-7 = 8;
ws-icon-8 = 9;󰙯
ws-icon-9 = 10;

label-focused =  "%icon%"
label-focused-foreground = #050717
label-focused-background = #a5d3f0
label-focused-padding = 2
 
label-unfocused =  %icon%
label-unfocused-padding = 2

label-visible =  %icon%
label-visible-padding = 2

label-urgent =  %icon%
label-urgent-foreground = #050717
label-urgent-background = #7adfff
label-urgent-padding = 2


;####### CPU MODULE #######
;#########################

[module/cpu]
type = internal/cpu

; Seconds to sleep between updates
; Default: 1
interval = 0.5

; Default: 80
; New in version 3.6.0
warn-percentage = 95
format = <label>
label = "  %percentage%% "
label-warn =   %percentage%%
label-padding = 2

;###### MEMORY MODULE #######
;###########################

[module/memory]
type = internal/memory

; Seconds to sleep between updates
; Default: 1
interval = 3

warn-percentage = 95
label =   %gb_used%
format = <label> 

;###### DATE MODULE ######
;############################

[module/date]
type = internal/date

interval = 1.0

date =   %d/%m/%Y  
date-alt =   %A, %d %B %Y

format = <label>

label = %date%

 
;###### NETWORK MODULE ######
;############################

;[module/wifi-ssid]
;type = custom/script
;exec =  ~/.config/polybar/scripts/ip/ip.sh -s
;interval = 1
;label-padding = 2

[module/ip]
type = custom/script
exec =  echo " |   $(~/.config/polybar/scripts/ip.sh -f)   | "
label-padding = 2
click-left =  ~/.config/polybar/scripts/ip.sh -s

;###### CALENDAR MODULE ######
;############################

[module/calendar] 
type = custom/script
exec =  ~/.config/polybar/scripts/calendar.sh
click-left = ~/.config/polybar/scripts/calendar.sh --popup &
label-padding = 1

;###### VOLUME MODULE ######
;###########################

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 0.1
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
click-right = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
label-padding = 1

;###### SPOTIFY MODULE ######
;############################

[module/spotify]
type = custom/script
tail = true
format-prefix = "   "
format = <label>
exec = ~/.config/polybar/scripts/spotify_player/scrolling_label.sh
click-left = i3-msg 'workspace "8"'
label-padding = 1


[module/spotify-prev]
type = custom/script
exec = echo "玲" 
format = <label>
click-left = playerctl previous spotify
label-padding = 1

[module/spotify-next]
type = custom/script
exec = echo "怜   -"
format = <label>
click-left = playerctl next spotify
label-padding = 1

[module/spotify-play-pause]
type = custom/script
click-left = playerctl play-pause -p spotify
exec = ~/.config/polybar/scripts/spotify_player/spotify_status.sh --play-pause
interval = 0.1
