# Bind Sunshine to the Hyprland session rather than to login.
#
# Sunshine captures a Wayland output through wlr-screencopy, so it needs a live
# compositor and a valid HYPRLAND_INSTANCE_SIGNATURE. Started at login instead,
# it comes up before Hyprland exists, finds no output, and sits there broken
# until restarted by hand.

[Unit]
After=hyprland-session.target
PartOf=hyprland-session.target

[Service]
# The headless output is created at Hyprland start, but service ordering and
# exec_cmd ordering are independent, so assert it here too. remote-display is
# idempotent and also re-points output_name at the name the output actually got.
ExecStartPre=%h/.local/bin/remote-display up

[Install]
WantedBy=hyprland-session.target
