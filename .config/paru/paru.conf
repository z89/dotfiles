#
# $PARU_CONF
# /etc/paru.conf
# ~/.config/paru/paru.conf
#
# See the paru.conf(5) manpage for options

#
# GENERAL OPTIONS
#
[options]
PgpFetch
# Devel is off, as it was in yay: -git packages update only when their AUR version changes.
# Turn it on to rebuild them on every upstream commit (paru --gendb has recorded the current ones).
#Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
#AurOnly
BottomUp
RemoveMake = ask
SudoLoop
#UseAsk
#SaveChanges
CombinedUpgrade
CleanAfter
#UpgradeMenu
NewsOnUpgrade

#LocalRepo
#Chroot
#Sign
#SignDb
#KeepRepoCache

#
# Binary OPTIONS
#
#[bin]
#FileManager = vifm
#MFlags = --skippgpcheck
#Sudo = doas

# sepia from the local checkout's committed main, until the signed [sepia] pacman repo
# is live. remove this section then
[sepia-local]
Url = file:///home/archie/.local/src/sepia
Path = pkg
SkipReview
