font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
# At this monitor's effective DPI this resolves to an integer 13px glyph grid,
# avoiding the soft 12.5px rasterisation produced by the previous 10pt size.
font_size        10.4

window_padding_width 14 18

confirm_os_window_close 0
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}
include matugen-theme.conf
include dank-tabs.conf
