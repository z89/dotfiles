# Fallback for GTK apps that do not read gsettings. The live source of truth on
# Wayland is dconf: see ~/.config/gsettings/interface.ini and the README.
# Theme and icon names are deliberately absent; theme-apply flips them at runtime.
[Settings]
gtk-font-name=Inter 11
gtk-application-prefer-dark-theme=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
