# Bluetooth audio.
#
# HFP is enabled so the AirPods microphone is available, but automatic
# profile switching is OFF. Switching is manual, via ~/.local/bin/airpods-mic.
#
# Why: Bluetooth Classic cannot carry A2DP and HFP simultaneously. Whenever
# the mic is live, playback drops to 16 kHz mono (mSBC). That is the radio
# spec, not a configuration problem. Autoswitch would let any app that opens
# the mic silently wreck playback quality, so it stays off and the drop
# happens only when deliberately asked for.
#
# Replaces disable-hfp.conf (2026-04-05), which turned HFP off entirely by
# restricting bluez5.roles to the A2DP pair. Omitting bluez5.roles here
# restores the upstream default, which enables all HFP/HSP roles.

monitor.bluez.properties = {
  bluez5.hfphsp-backend   = "native"
  bluez5.enable-msbc      = true
  bluez5.enable-sbc-xq    = true
  bluez5.enable-hw-volume = true
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
