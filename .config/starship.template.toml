[username]
style_user = "bold accent-dim"
style_root = "bold red"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.dank]
# Standard names are redefined so every "bold purple" style in this file
# resolves to the generated family instead of the raw terminal colour.
red = "{{palette.red}}"
green = "{{palette.green}}"
yellow = "{{palette.yellow}}"
blue = "{{palette.blue}}"
purple = "{{palette.magenta}}"
cyan = "{{palette.cyan}}"
white = "{{palette.fg}}"
bright-black = "{{palette.muted}}"
accent = "{{palette.accent}}"
accent-dim = "{{palette.accent_dim}}"
accent-bright = "{{palette.accent_bright}}"
