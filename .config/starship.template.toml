"$schema" = 'https://starship.rs/config-schema.json'

# Rendered by palette-gen from the OKLCH wallpaper palette. Edit this file,
# not ~/.config/starship.toml, which is overwritten on every wallpaper change.
palette = "dank"


format = """
$username$hostname$directory$git_branch$git_commit$git_state$git_metrics\
$docker_context$package\
$c$cmake$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$golang$gradle\
$haskell$haxe$java$julia$kotlin$lua$nim$nodejs$ocaml$perl$php$python\
$rlang$ruby$rust$scala$swift$zig$buf$bun\
$nix_shell$conda$meson$memory_usage\
$cmd_duration\
$jobs$status$character"""

right_format = '$aws'

[aws]
format = '[$symbol($profile)]($style)'
symbol = ""
style = "bold {{palette.muted}}"

[buf]
symbol = " "

[bun]
style = "bold purple"
symbol = " "

[c]
style = "bold purple"
symbol = " "

[cpp]
style = "bold purple"
symbol = " "

[cmake]
style = "bold purple"
symbol = " "

[conda]
symbol = " "

[crystal]
style = "bold purple"
symbol = " "

[dart]
style = "bold purple"
symbol = " "

[deno]
style = "bold purple"
symbol = " "

[directory]
read_only = " 󰌾"
style = "bold accent"
[docker_context]
symbol = " "

[elixir]
style = "bold purple"
symbol = " "

[elm]
style = "bold purple"
symbol = " "

[fennel]
style = "bold purple"
symbol = " "

[fortran]
style = "bold purple"
symbol = " "

[fossil_branch]
symbol = " "

[gcloud]
symbol = " "

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "accent-dim"
[git_commit]
tag_symbol = '  '

[golang]
style = "bold purple"
symbol = " "

[gradle]
style = "bold purple"
symbol = " "

[guix_shell]
symbol = " "

